name: NEXUS Optimizer AI – Build und Tests

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'NexusOptimizer.sln'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/nexus-optimizer.yml'

permissions:
  contents: read

jobs:
  build-test:
    name: Build und Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET 10 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wiederherstellen
        run: dotnet restore NexusOptimizer.sln

      - name: Kompilieren (Release)
        run: dotnet build NexusOptimizer.sln -c Release --no-restore

      - name: Tests ausführen
        run: dotnet test NexusOptimizer.sln -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse
          path: artifacts/test-results
          if-no-files-found: warn
